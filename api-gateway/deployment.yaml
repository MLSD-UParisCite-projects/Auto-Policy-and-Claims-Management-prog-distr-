apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: monci2004/api-gateway:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            # URLs internes Kubernetes (DNS ClusterIP) des microservices
            - name: POLICY_SERVICE_URL
              value: "http://policy-service:8080"
            - name: CLAIM_SERVICE_URL
              value: "http://claim-service:8081"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  # Seule l'API Gateway est exposée vers l'extérieur (NodePort 30000)
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: gateway-http
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30000

