apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-service
  labels:
    app: policy-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-service
  template:
    metadata:
      labels:
        app: policy-service
        version: v1
    spec:
      containers:
        - name: policy-service
          image: monci2004/policy-service:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: policy-service
  labels:
    app: policy-service
spec:
  # ClusterIP : accessible uniquement en interne dans le cluster Kubernetes (par l'API Gateway)
  type: ClusterIP
  selector:
    app: policy-service
  ports:
    # Convention Istio : le nom du port doit commencer par "http-" ou "grpc-"
    - name: http-rest
      protocol: TCP
      port: 8080        # Port REST interne (appelé par api-gateway sur http://policy-service:8080)
      targetPort: 8080  # Port du conteneur FastAPI
    # TODO (Phase gRPC) : Exposer également le port gRPC (name: grpc-policy, port: 50051)
    # pour la communication inter-microservices (claim-service <-> policy-service).
