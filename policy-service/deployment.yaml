apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-service
  labels:
    app: policy-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-service
  template:
    metadata:
      labels:
        app: policy-service
    spec:
      containers:
        - name: policy-service
          image: monci2004/policy-service:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: policy-service
  labels:
    app: policy-service
spec:
  type: NodePort
  selector:
    app: policy-service
  ports:
    - name: rest-http
      protocol: TCP
      port: 8080        # Port REST (Utilisateur <-> Microservice)
      targetPort: 8080  # Port du conteneur FastAPI
      nodePort: 30080   # Port exposé sur Minikube
    # TODO (Phase gRPC) : Exposer également le port gRPC (ex: 50051) en interne
    # pour la communication inter-microservices (claim-service <-> policy-service).
