apiVersion: v1
kind: Service
metadata:
  name: policy-service
  labels:
    app: policy-service
spec:
  type: NodePort
  selector:
    app: policy-service
  ports:
    - protocol: TCP
      port: 8080        # Port interne au cluster Kubernetes (http://policy-service:8080 pour claim-service)
      targetPort: 8080  # Port du conteneur FastAPI
      nodePort: 30080   # Port exposé vers l'extérieur (http://localhost:30080)

